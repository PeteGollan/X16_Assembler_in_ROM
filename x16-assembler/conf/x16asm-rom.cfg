MEMORY {
    ZP:             file = "", start = $0022, size = $0080 - $0022, define = yes;
    VARMEM:         file = "", start = $a000, size = $2000, define=yes;
#    ROMBANK:        start = $c000, size = $4000, fill=yes, bank=$0d, fillval=$aa;
    ROMBANK:        start = $c000, size = $4000, fill=no, bank=$0d;
}
SEGMENTS {
    ZEROPAGE: load = ZP,        type = zp, define=yes;
#    VARS:     load = VARMEM,    type = bss, define = yes;
    VARS:     load = VARMEM,    type = rw, define = yes;
    CODE:     load = ROMBANK,   type = ro;
}
